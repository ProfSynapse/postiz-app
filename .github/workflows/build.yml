---
name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    

    strategy:
      matrix:
        node-version: ['22.23.4']
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # Read the pinned packageManager version from package.json.
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      # Compute once before installation; cache post steps must not rehash the
      # installed dependency tree or a lockfile rewritten during installation.
      - name: Compute cache keys
        id: cache-keys
        env:
          CACHE_PREFIX: ${{ runner.os }}-${{ runner.arch }}-node-${{ matrix.node-version }}
          DEPENDENCY_HASH: ${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
        run: |
          echo "pnpm=$CACHE_PREFIX-pnpm-store-v2-$DEPENDENCY_HASH" >> "$GITHUB_OUTPUT"
          echo "next=$CACHE_PREFIX-nextjs-v2-$DEPENDENCY_HASH-" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ steps.cache-keys.outputs.pnpm }}

      - name: Setup Next.js cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/apps/frontend/.next/cache
          key: ${{ steps.cache-keys.outputs.next }}${{ github.sha }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.next }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security regression tests
        run: pnpm test:security

      - name: Build
        run: pnpm run build
